name: frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: unit

    env:
      # Django requires DJANGO_SECRET_KEY to start.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      E2E_USERNAME: e2e_user
      E2E_PASSWORD: e2e_password_123

    steps:
      # 1. Frontend checkout (this repo) at the workspace root.
      - uses: actions/checkout@v5

      # 2. Backend checkout as a sibling. If the backend repo is private,
      #    create a fine-grained PAT with read access and store it as the
      #    BACKEND_REPO_TOKEN secret. For public repos GITHUB_TOKEN works.
      - name: Check out backend
        uses: actions/checkout@v5
        with:
          repository: AayushGala/expense_tracker
          path: backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Migrate + seed
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py seed_defaults
          python manage.py seed_e2e

      - name: Start Django (background)
        working-directory: backend
        run: |
          nohup python manage.py runserver 0.0.0.0:8000 --noreload > django.log 2>&1 &
          # Wait until the API responds.
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/api/schema/ > /dev/null; then
              echo "Django up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Django failed to start"
          tail django.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
